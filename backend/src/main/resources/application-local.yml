# Offline fallback: no MySQL, no Redis, no Kafka. Boots on its own.
spring:
  datasource:
    url: jdbc:h2:file:./data/bankflow-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # The migrations are MySQL-specific (InnoDB, BIT(1), DATETIME(6)), so on H2 the
  # schema comes from the entities instead. This profile is an offline fallback
  # only — dev and the test suite both run the real migrations on MySQL.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
