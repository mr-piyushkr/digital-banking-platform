# Integration tests run against real MySQL, on their own schema.
#
# H2 would be faster, but the behaviour these tests exist to prove — SELECT ...
# FOR UPDATE row locking, unique-constraint violations on idempotency keys,
# DECIMAL rounding — is InnoDB behaviour. Testing it on H2 would prove nothing.
#
# TestFlywayConfig drops and re-migrates the schema once per context, so every
# run starts from an empty, freshly migrated database.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${TEST_DB_NAME:bankflow_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Larger than the concurrency test's thread count, so that test measures
      # row-lock contention rather than connection starvation.
      maximum-pool-size: 24
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

bankflow:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.bankflow: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
